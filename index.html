<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سیستم آموزشی ریاضیات جلال</title>
    <meta
      name="description"
      content="سیستم آموزشی ریاضیات جلال برای صنف‌های 7 تا 12 با درس‌های حساب، الجبر، هندسه، مثلثات و ریاضیات عالی"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">J</div>
          <div>
            <p class="eyebrow">سیستم آموزشی</p>
            <h1>ریاضیات جلال</h1>
          </div>
        </div>
        <nav class="class-tabs" id="classTabs"></nav>
      </header>

      <main class="main-layout">
        <aside class="sidebar panel">
          <h2>شاخه‌های اصلی</h2>
          <div id="subjectGrid" class="subject-grid"></div>
        </aside>

        <section class="content panel" id="lessonPanel"></section>
      </main>
    </div>

    <template id="lessonTemplate">
      <article class="lesson-card">
        <div class="lesson-header">
          <div>
            <p class="lesson-tag">عنوان درس</p>
            <h3 class="lesson-title"></h3>
          </div>
          <button class="small-btn primary" data-action="video">ویدیو</button>
        </div>

        <div class="course-spotlight">
          <div class="concept-box">
            <h4>تعریف</h4>
            <p class="lesson-definition"></p>
          </div>
          <div class="concept-box">
            <h4>توضیح</h4>
            <p class="lesson-explanation"></p>
          </div>
        </div>

        <div class="example-box">
          <h4>مثال</h4>
          <div class="example-list"></div>
        </div>

        <div class="media-actions">
          <button class="small-btn" data-action="workbook">کاربرگ ۳۰ سوالی</button>
          <button class="small-btn accent" data-action="quiz">بازی آموزشی</button>
          <button class="small-btn ghost" data-action="print">چاپ</button>
        </div>
      </article>
    </template>

    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-content">
        <button class="close-btn" data-close="true">×</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
